<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header><div><small>DEVOPS PORTFOLIO PROJECT</small><h1>TaskFlow</h1><p>Plan work. Track progress. Get things done.</p></div><span class="live">● API + database</span></header><section class="stats"><div>Total tasks<strong id="total">0</strong></div><div>In progress<strong id="progress">0</strong></div><div>Completed<strong id="done">0</strong></div></section><section class="panel"><h2>Create a task</h2><form id="form"><input id="title" placeholder="Task title" required maxlength="180"><input id="desc" placeholder="Description (optional)"><select id="priority"><option>Medium</option><option>High</option><option>Low</option></select><button>Add task +</button></form></section><section class="listhead"><h2>Your tasks</h2><select id="filter"><option>All</option><option>Pending</option><option>In Progress</option><option>Completed</option></select></section><section id="tasks">Loading…</section><footer>Docker Compose · Jenkins CI/CD · PostgreSQL</footer></main><script src="app.js"></script></body></html>
